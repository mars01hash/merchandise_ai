<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RMG ERP – AI Impact & Error Reduction Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f6f9;
        }

        .sidebar {
            height: 100vh;
            background: #0d1b2a;
            color: #ecf0f1;
            padding-top: 20px;
            overflow-y: auto;
            position: sticky;
            top: 0;
            width: 260px;
            flex-shrink: 0;
        }

        .sidebar .module-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            color: #b0c4de;
            text-decoration: none;
            border-left: 3px solid transparent;
            transition: 0.2s;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .sidebar .module-link:hover,
        .sidebar .module-link.active {
            background: #1b2a41;
            color: #fff;
            border-left-color: #4a9eff;
        }

        .sidebar .module-link i {
            font-size: 1.2rem;
            width: 24px;
            text-align: center;
        }

        .main-content {
            padding: 30px 25px;
            overflow-y: auto;
            height: 100vh;
            flex: 1;
            background: #f4f6f9;
        }

        .module-pane {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .module-pane.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .demo-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid #e9edf4;
        }

        .badge-ai {
            background: #7c3aed;
            color: white;
            font-size: 0.7rem;
            padding: 4px 12px;
            border-radius: 20px;
            letter-spacing: 0.3px;
        }

        .badge-error {
            background: #dc2626;
            color: white;
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 20px;
        }

        .btn-ai {
            background: #7c3aed;
            border: none;
            color: white;
            transition: 0.2s;
        }

        .btn-ai:hover {
            background: #5b21b6;
            color: white;
        }

        .btn-outline-ai {
            border: 1px solid #7c3aed;
            color: #7c3aed;
            background: transparent;
        }

        .btn-outline-ai:hover {
            background: #7c3aed;
            color: white;
        }

        .chat-box {
            background: #f8fafc;
            border-radius: 12px;
            padding: 15px;
            max-height: 200px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .chat-msg {
            margin-bottom: 10px;
            padding: 8px 14px;
            border-radius: 18px;
            max-width: 85%;
            word-break: break-word;
        }

        .chat-msg.user {
            background: #e2e8f0;
            align-self: flex-end;
            margin-left: auto;
        }

        .chat-msg.ai {
            background: #dbeafe;
            align-self: flex-start;
        }

        /* Impact Simulator Styles */
        .impact-stage {
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 20px;
            margin-top: 15px;
            transition: 0.3s;
        }

        .impact-stage.processing {
            border-color: #7c3aed;
            background: #f5f3ff;
        }

        .impact-stage.done {
            border-color: #16a34a;
            background: #f0fdf4;
        }

        .error-highlight {
            background: #fee2e2;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid #fca5a5;
        }

        .fixed-highlight {
            background: #dcfce7;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid #86efac;
        }

        .progress-ai {
            height: 8px;
            background: #e2e8f0;
            border-radius: 8px;
            overflow: hidden;
        }

        .progress-ai .bar {
            height: 100%;
            width: 0%;
            background: #7c3aed;
            transition: width 0.1s linear;
        }

        .impact-metric {
            text-align: center;
            padding: 12px;
            background: #f8fafc;
            border-radius: 12px;
        }

        .impact-metric .number {
            font-size: 2rem;
            font-weight: 700;
            color: #0f172a;
        }

        .impact-metric .label {
            font-size: 0.8rem;
            color: #475569;
        }

        .impact-metric .number.green {
            color: #16a34a;
        }

        .impact-metric .number.red {
            color: #dc2626;
        }

        .impact-metric .number.purple {
            color: #7c3aed;
        }

        .sidebar-header {
            padding: 0 20px 20px 20px;
            border-bottom: 1px solid #2a3a4f;
            margin-bottom: 12px;
        }

        .sidebar-header h5 {
            color: #f1f5f9;
            font-weight: 600;
        }

        .sidebar-header small {
            color: #94a3b8;
        }

        .module-title {
            font-size: 1.6rem;
            font-weight: 600;
            color: #0f172a;
        }

        .module-sub {
            color: #475569;
            margin-bottom: 20px;
        }

        .sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: #2d4a6b;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="d-flex">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h5><i class="bi bi-robot me-2"></i>AI Impact Demo</h5>
                <small>Run AI → See Impact ↓ Error</small>
            </div>
            <nav class="nav flex-column" id="moduleNav"></nav>
            <div class="mt-3 px-3 text-center text-white-50" style="font-size:0.75rem;">
                <i class="bi bi-shield-check me-1"></i> Click "Run AI" to see the magic
            </div>
        </div>

        <!-- Main -->
        <div class="main-content" id="mainContent"></div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="aiModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="aiModalLabel">AI Impact Detail</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="aiModalBody">...</div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ====== MODULES ======
        const modules = [
            { id: 'buyer-master', label: 'Buyer Master', icon: 'bi-person-badge' },
            { id: 'buyer-order', label: 'Buyer Order', icon: 'bi-file-earmark-text' },
            { id: 'style-master', label: 'Style Master', icon: 'bi-tags' },
            { id: 'order-booking', label: 'Order Booking', icon: 'bi-cart-check' },
            { id: 'ie-smv', label: 'IE & SMV', icon: 'bi-speedometer2' },
            { id: 'costing', label: 'Product Costing', icon: 'bi-calculator' },
            { id: 'cost-sheet', label: 'Cost Sheet', icon: 'bi-table' },
            { id: 'target-margin', label: 'Target & Margin', icon: 'bi-graph-up-arrow' },
            { id: 'budgeting', label: 'Order Budgeting', icon: 'bi-wallet2' },
            { id: 'material', label: 'Material Requirement', icon: 'bi-box-seam' },
            { id: 'supplier-cs', label: 'Supplier CS', icon: 'bi-files' },
            { id: 'fabric-trims', label: 'Fabric & Trims', icon: 'bi-layers' },
            { id: 'sample', label: 'Sample Development', icon: 'bi-flask' },
            { id: 'ta-calendar', label: 'T&A Calendar', icon: 'bi-calendar-event' },
            { id: 'production', label: 'Production Follow-up', icon: 'bi-gear' },
            { id: 'shipment', label: 'Shipment Planning', icon: 'bi-truck' },
            { id: 'order-status', label: 'Order Status', icon: 'bi-speedometer' },
            { id: 'profitability', label: 'Profitability', icon: 'bi-coin' },
        ];

        // ====== HELPERS ======
        function showModal(title, html) {
            document.getElementById('aiModalLabel').textContent = title;
            document.getElementById('aiModalBody').innerHTML = html;
            const modal = new bootstrap.Modal(document.getElementById('aiModal'));
            modal.show();
        }

        // ====== AI IMPACT SIMULATOR ======
        function runAIImpact(moduleId) {
            const container = document.getElementById('impact_' + moduleId);
            if (!container) return;
            const stage = container.querySelector('.impact-stage');
            const progress = container.querySelector('.progress-ai .bar');
            const resultArea = container.querySelector('.impact-result');
            const btn = container.querySelector('.btn-run-ai');

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> AI Processing...';
            stage.className = 'impact-stage processing';
            progress.style.width = '0%';

            let width = 0;
            const interval = setInterval(() => {
                width += Math.random() * 15 + 5;
                if (width > 100) width = 100;
                progress.style.width = width + '%';
                if (width >= 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        stage.className = 'impact-stage done';
                        resultArea.style.display = 'block';
                        btn.disabled = false;
                        btn.innerHTML = '<i class="bi bi-arrow-repeat"></i> Re-run AI';
                        // Trigger confetti effect in result
                        resultArea.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }, 300);
                }
            }, 120);
        }

        // ====== BUILD PANES ======
        function buildPane(moduleId) {
            // Specific error scenarios for each module
            const scenarios = {
                'buyer-master': {
                    error: 'Duplicate buyer "H&M" created twice. Compliance doc missing.',
                    fix: 'Merged duplicates, auto-attached compliance doc from shared drive.',
                    timeSaved: '4.2 min',
                    costImpact: 'N/A',
                    errorsFixed: '2'
                },
                'buyer-order': {
                    error: 'PO quantity misread as 52,000 (should be 5,200). Unit price $12.50, currency missing.',
                    fix: 'Corrected qty to 5,200. Added USD currency via context analysis.',
                    timeSaved: '3.8 min',
                    costImpact: 'Prevented $32,500 over-ordering',
                    errorsFixed: '3'
                },
                'style-master': {
                    error: 'GSM entered as "80" (actual 180). Fabric composition missing.',
                    fix: 'Auto-corrected GSM to 180 using OCR. Inferred 100% Cotton from tech pack.',
                    timeSaved: '2.5 min',
                    costImpact: 'N/A',
                    errorsFixed: '2'
                },
                'order-booking': {
                    error: 'Destination missing. Color breakdown totals 5,000 vs order 5,200.',
                    fix: 'Filled destination from buyer master. Auto-balanced breakdown ratios.',
                    timeSaved: '3.1 min',
                    costImpact: 'N/A',
                    errorsFixed: '2'
                },
                'ie-smv': {
                    error: 'SMV overestimated at 15.0 min (should be 12.5). Unrealistic cutting start date.',
                    fix: 'SMV corrected using operation analysis. TNA dates recalculated.',
                    timeSaved: '2.2 min',
                    costImpact: 'Reduced CM cost estimate by $0.40/pcs',
                    errorsFixed: '2'
                },
                'costing': {
                    error: 'Fabric rate $3.50/yd (actual $3.20). Forgot to add overhead.',
                    fix: 'Corrected rate to $3.20. Auto-added 5% overhead.',
                    timeSaved: '3.0 min',
                    costImpact: 'Prevented $1,560 overcosting',
                    errorsFixed: '3'
                },
                'cost-sheet': {
                    error: 'Missing overhead cost. Total formula missed trims line.',
                    fix: 'Added overhead. Recalculated totals including all lines.',
                    timeSaved: '2.8 min',
                    costImpact: 'N/A',
                    errorsFixed: '2'
                },
                'target-margin': {
                    error: 'Target price set too low ($13.00 vs ideal $14.25).',
                    fix: 'Recommended $14.25 based on competitor/historical data.',
                    timeSaved: '3.5 min',
                    costImpact: 'Increased margin by $1.25/pcs',
                    errorsFixed: '1'
                },
                'budgeting': {
                    error: 'Budget approved without checking actual spend. $2k overrun risk.',
                    fix: 'Flagged overrun early. Suggested reallocation from trims.',
                    timeSaved: '4.0 min',
                    costImpact: 'Prevented $2,000 overspend',
                    errorsFixed: '1'
                },
                'material': {
                    error: 'Applied wastage twice (5% × 5%). Over-ordered fabric by 10%.',
                    fix: 'Detected double-wastage. Corrected formula to single 5%.',
                    timeSaved: '2.0 min',
                    costImpact: 'Prevented $1,200 excess ordering',
                    errorsFixed: '1'
                },
                'supplier-cs': {
                    error: 'Chose supplier with higher price ($3.35 vs $3.20) due to missed quote.',
                    fix: 'Auto-compared all quotes, recommended Fabric Ltd.',
                    timeSaved: '3.2 min',
                    costImpact: 'Saved $0.15/yd = $982.50 total',
                    errorsFixed: '1'
                },
                'fabric-trims': {
                    error: 'Used 1.0 yd consumption instead of 1.2 yd. Shortage of 1,040 yd.',
                    fix: 'Corrected consumption to 1.2 yd from library. Recalculated demand.',
                    timeSaved: '2.4 min',
                    costImpact: 'Prevented $3,328 shortage cost',
                    errorsFixed: '2'
                },
                'sample': {
                    error: 'Misread "color change" as "size change". Wrong action taken.',
                    fix: 'Extracted correct intent. Created "color shade update" task.',
                    timeSaved: '3.0 min',
                    costImpact: 'N/A',
                    errorsFixed: '1'
                },
                'ta-calendar': {
                    error: 'Cutting start set before fabric arrival date. Invalid dependency.',
                    fix: 'Detected conflict. Auto-adjusted start date to after arrival.',
                    timeSaved: '2.5 min',
                    costImpact: 'N/A',
                    errorsFixed: '1'
                },
                'production': {
                    error: 'Manager didn\'t notice sewing delay for 3 days.',
                    fix: 'Real-time monitoring alerted immediately. Escalated to manager.',
                    timeSaved: '5.0 min',
                    costImpact: 'Prevented 3-day shipment delay',
                    errorsFixed: 'N/A'
                },
                'shipment': {
                    error: 'Forgot to attach packing list – customs hold risk.',
                    fix: 'Auto-checked document completeness, flagged missing file.',
                    timeSaved: '3.8 min',
                    costImpact: 'Prevented $500 customs delay fee',
                    errorsFixed: '1'
                },
                'order-status': {
                    error: 'Status misread as "On Hold" (actually "Ready to Ship").',
                    fix: 'Unified dashboard with clear status indicators and drill-down.',
                    timeSaved: '2.0 min',
                    costImpact: 'N/A',
                    errorsFixed: '1'
                },
                'profitability': {
                    error: 'Trims cost allocated to wrong order – profit distorted.',
                    fix: 'Auto-mapped costs to correct order using BOM linkage.',
                    timeSaved: '4.5 min',
                    costImpact: 'Accurate profit reporting',
                    errorsFixed: '1'
                }
            };

            const s = scenarios[moduleId] || { error: 'Data inconsistency detected.', fix: 'AI corrected all anomalies.', timeSaved: '3.0 min', costImpact: 'N/A', errorsFixed: '2' };

            return `
            <div class="module-title">${modules.find(m => m.id === moduleId)?.label || 'Module'} <span class="badge-ai"><i class="bi bi-robot"></i> AI Impact</span></div>
            <div class="module-sub">Click <strong>"Run AI"</strong> to see how AI fixes errors, saves time, and prevents cost.</div>

            <div id="impact_${moduleId}" class="demo-card">
                <h6><i class="bi bi-database me-2"></i> Raw Data (Human Entry)</h6>
                <div class="bg-light p-3 rounded-3 border">
                    <p class="mb-1"><span class="badge-error">ERROR</span> <span class="error-highlight">${s.error}</span></p>
                    <p class="small text-muted mb-0">⏱️ Manual processing would take ~${s.timeSaved} to fix.</p>
                </div>

                <div class="mt-3 d-flex align-items-center gap-3">
                    <button class="btn btn-ai btn-run-ai" onclick="runAIImpact('${moduleId}')">
                        <i class="bi bi-play-circle"></i> Run AI Impact Analysis
                    </button>
                    <span class="text-muted small">AI will validate, correct, and optimize</span>
                </div>

                <!-- Progress -->
                <div class="progress-ai mt-3"><div class="bar" style="width:0%;"></div></div>

                <!-- Stage container -->
                <div class="impact-stage mt-3">
                    <div class="text-center text-muted"><i class="bi bi-hourglass-split"></i> AI is idle. Click "Run AI" to start.</div>
                </div>

                <!-- Result (hidden initially) -->
                <div class="impact-result mt-3" style="display:none;">
                    <hr />
                    <h6><i class="bi bi-check-circle-fill text-success me-2"></i> AI Impact & Results</h6>
                    
                    <div class="row g-3 mb-3">
                        <div class="col-6 col-md-3">
                            <div class="impact-metric">
                                <div class="number green"><i class="bi bi-check2-circle"></i> ${s.errorsFixed}</div>
                                <div class="label">Errors Fixed</div>
                            </div>
                        </div>
                        <div class="col-6 col-md-3">
                            <div class="impact-metric">
                                <div class="number purple"><i class="bi bi-clock"></i> ${s.timeSaved}</div>
                                <div class="label">Time Saved</div>
                            </div>
                        </div>
                        <div class="col-6 col-md-3">
                            <div class="impact-metric">
                                <div class="number green"><i class="bi bi-currency-dollar"></i> ${s.costImpact}</div>
                                <div class="label">Cost Impact</div>
                            </div>
                        </div>
                        <div class="col-6 col-md-3">
                            <div class="impact-metric">
                                <div class="number purple">99%</div>
                                <div class="label">Data Accuracy (was 72%)</div>
                            </div>
                        </div>
                    </div>

                    <div class="alert alert-success">
                        <i class="bi bi-robot me-2"></i> <strong>AI Action:</strong> ${s.fix}
                    </div>

                    <div class="row mt-2">
                        <div class="col-md-6">
                            <div class="border p-2 rounded-3 bg-danger bg-opacity-10">
                                <span class="badge-error">BEFORE (Manual)</span>
                                <p class="small mt-1">${s.error}</p>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="border p-2 rounded-3 bg-success bg-opacity-10">
                                <span class="badge bg-success">AFTER (AI Corrected)</span>
                                <p class="small mt-1">${s.fix}</p>
                            </div>
                        </div>
                    </div>

                    <div class="mt-3">
                        <button class="btn btn-sm btn-outline-ai" onclick="showModal('Full Impact Report','<b>AI Impact Summary</b><br><ul><li>Errors fixed: ${s.errorsFixed}</li><li>Time saved: ${s.timeSaved}</li><li>Cost impact: ${s.costImpact}</li><li>Accuracy improved from 72% to 99%</li><li>Source: SRS v2.1 AI Governance (MER-AI-BR-001 to 026)</li></ul>')">
                            <i class="bi bi-file-text"></i> View Full Report
                        </button>
                    </div>
                </div>
            </div>

            <!-- Chat for extra questions -->
            <div class="demo-card">
                <h6><i class="bi bi-chat-dots me-2"></i> Ask about AI Impact</h6>
                <div class="chat-box" id="chat_${moduleId}"></div>
                <div class="input-group mt-2">
                    <input type="text" class="form-control" id="input_${moduleId}" placeholder="e.g. How did AI save time?" />
                    <button class="btn btn-ai" onclick="sendChat('chat_${moduleId}','input_${moduleId}')">Ask</button>
                </div>
            </div>
        `;
        }

        function sendChat(containerId, inputId) {
            const input = document.getElementById(inputId);
            const msg = input.value.trim();
            if (!msg) return;
            const container = document.getElementById(containerId);
            const userDiv = document.createElement('div');
            userDiv.className = 'chat-msg user';
            userDiv.textContent = msg;
            container.appendChild(userDiv);
            input.value = '';
            setTimeout(() => {
                const aiDiv = document.createElement('div');
                aiDiv.className = 'chat-msg ai';
                const responses = [
                    'AI corrected 3 errors in 2.5 seconds, saving ~4 minutes of manual work.',
                    'Impact: Prevented a $2,340 over-ordering mistake by fixing the consumption formula.',
                    'Accuracy improved from 72% to 99% – no critical data entry errors remain.',
                    'AI automatically validated 12 fields, flagged 2 missing, and suggested corrections.',
                    'This specific correction saved the team $500 in potential customs fees.',
                ];
                aiDiv.textContent = responses[Math.floor(Math.random() * responses.length)];
                container.appendChild(aiDiv);
                container.scrollTop = container.scrollHeight;
            }, 500);
        }

        // ====== INIT ======
        document.addEventListener('DOMContentLoaded', function () {
            const nav = document.getElementById('moduleNav');
            const main = document.getElementById('mainContent');

            modules.forEach((mod, idx) => {
                const link = document.createElement('a');
                link.className = 'module-link' + (idx === 0 ? ' active' : '');
                link.setAttribute('data-module', mod.id);
                link.innerHTML = `<i class="bi ${mod.icon}"></i> ${mod.label}`;
                link.addEventListener('click', function (e) {
                    e.preventDefault();
                    document.querySelectorAll('.module-link').forEach(l => l.classList.remove('active'));
                    this.classList.add('active');
                    document.querySelectorAll('.module-pane').forEach(p => p.classList.remove('active'));
                    const pane = document.getElementById('pane-' + mod.id);
                    if (pane) pane.classList.add('active');
                });
                nav.appendChild(link);

                const pane = document.createElement('div');
                pane.className = 'module-pane' + (idx === 0 ? ' active' : '');
                pane.id = 'pane-' + mod.id;
                pane.innerHTML = buildPane(mod.id);
                main.appendChild(pane);
            });

            // Init chat boxes
            document.querySelectorAll('.chat-box:empty').forEach(c => {
                const div = document.createElement('div');
                div.className = 'chat-msg ai';
                div.textContent = 'I can explain how AI reduces errors here. Ask me!';
                c.appendChild(div);
            });

            // Global Impact Summary at top of first module
            const summary = document.createElement('div');
            summary.className = 'demo-card bg-light';
            summary.innerHTML = `
            <h5><i class="bi bi-robot me-2"></i> AI Impact Overview</h5>
            <div class="row text-center">
                <div class="col-3"><div class="impact-metric"><div class="number green">78%</div><div class="label">Manual Effort Reduction</div></div></div>
                <div class="col-3"><div class="impact-metric"><div class="number purple">~4.2 min</div><div class="label">Avg Time Saved per Order</div></div></div>
                <div class="col-3"><div class="impact-metric"><div class="number green">$1,200+</div><div class="label">Avg Cost Avoided per Order</div></div></div>
                <div class="col-3"><div class="impact-metric"><div class="number purple">99%</div><div class="label">Data Accuracy (vs 72% manual)</div></div></div>
            </div>
            <p class="small text-muted mt-2"><i class="bi bi-info-circle"></i> Based on SRS v2.1 AI governance (MER-AI-BR-001 to 026). Click any module and <strong>Run AI</strong> to see it in action.</p>
        `;
            const firstPane = document.getElementById('pane-buyer-master');
            if (firstPane) firstPane.insertBefore(summary, firstPane.firstChild);
        });
    </script>
</body>

</html>
