<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RMG ERP – Merchandising AI Demo (Expanded)</title>
    <!-- Bootstrap + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f6f9;
        }

        .sidebar {
            height: 100vh;
            background: #0d1b2a;
            color: #ecf0f1;
            padding-top: 20px;
            overflow-y: auto;
            position: sticky;
            top: 0;
            width: 260px;
            flex-shrink: 0;
        }

        .sidebar .module-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            color: #b0c4de;
            text-decoration: none;
            border-left: 3px solid transparent;
            transition: 0.2s;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .sidebar .module-link:hover,
        .sidebar .module-link.active {
            background: #1b2a41;
            color: #ffffff;
            border-left-color: #4a9eff;
        }

        .sidebar .module-link i {
            font-size: 1.2rem;
            width: 24px;
            text-align: center;
        }

        .main-content {
            padding: 30px 25px;
            overflow-y: auto;
            height: 100vh;
            flex: 1;
            background: #f4f6f9;
        }

        .module-pane {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .module-pane.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .demo-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
            padding: 24px;
            margin-bottom: 24px;
            transition: 0.2s;
            border: 1px solid #e9edf4;
        }

        .demo-card:hover {
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.08);
        }

        .badge-ai {
            background: #7c3aed;
            color: white;
            font-size: 0.7rem;
            padding: 4px 12px;
            border-radius: 20px;
            letter-spacing: 0.3px;
        }

        .btn-ai {
            background: #7c3aed;
            border: none;
            color: white;
            transition: 0.2s;
        }

        .btn-ai:hover {
            background: #5b21b6;
            color: white;
        }

        .btn-outline-ai {
            border: 1px solid #7c3aed;
            color: #7c3aed;
            background: transparent;
        }

        .btn-outline-ai:hover {
            background: #7c3aed;
            color: white;
        }

        .chat-box {
            background: #f8fafc;
            border-radius: 12px;
            padding: 15px;
            max-height: 200px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .chat-msg {
            margin-bottom: 10px;
            padding: 8px 14px;
            border-radius: 18px;
            max-width: 85%;
            word-break: break-word;
        }

        .chat-msg.user {
            background: #e2e8f0;
            align-self: flex-end;
            margin-left: auto;
        }

        .chat-msg.ai {
            background: #dbeafe;
            align-self: flex-start;
        }

        .extract-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
        }

        .extract-item {
            background: #f1f5f9;
            padding: 10px 14px;
            border-radius: 8px;
            border-left: 4px solid #7c3aed;
        }

        .extract-item .label {
            font-size: 0.7rem;
            color: #475569;
            font-weight: 600;
            text-transform: uppercase;
        }

        .extract-item .value {
            font-size: 0.95rem;
            font-weight: 500;
        }

        .risk-gauge {
            width: 100%;
            height: 12px;
            background: #e2e8f0;
            border-radius: 12px;
            margin: 8px 0;
        }

        .risk-gauge .fill {
            height: 100%;
            border-radius: 12px;
            background: #22c55e;
        }

        .risk-gauge .fill.warning {
            background: #eab308;
        }

        .risk-gauge .fill.danger {
            background: #ef4444;
        }

        .similarity-card {
            border: 1px solid #e9edf4;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .comparison-table td {
            vertical-align: middle;
        }

        .delta.positive {
            color: #16a34a;
            font-weight: 600;
        }

        .delta.negative {
            color: #dc2626;
            font-weight: 600;
        }

        .sidebar-header {
            padding: 0 20px 20px 20px;
            border-bottom: 1px solid #2a3a4f;
            margin-bottom: 12px;
        }

        .sidebar-header h5 {
            color: #f1f5f9;
            font-weight: 600;
        }

        .sidebar-header small {
            color: #94a3b8;
        }

        .module-title {
            font-size: 1.6rem;
            font-weight: 600;
            color: #0f172a;
        }

        .module-sub {
            color: #475569;
            margin-bottom: 20px;
        }

        .image-placeholder {
            background: #eef2f6;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 2px dashed #cbd5e1;
            color: #64748b;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .image-placeholder i {
            font-size: 2.5rem;
            color: #94a3b8;
            margin-bottom: 8px;
        }

        .metric-badge {
            font-size: 1.8rem;
            font-weight: 700;
            color: #0f172a;
        }

        .sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: #2d4a6b;
            border-radius: 8px;
        }

        .sidebar::-webkit-scrollbar-track {
            background: transparent;
        }

        .pulse-glow {
            animation: pulse 1.8s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(124, 58, 237, 0.2);
            }

            50% {
                box-shadow: 0 0 0 8px rgba(124, 58, 237, 0);
            }
        }

        .status-badge {
            background: #dbeafe;
            color: #1e40af;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        .status-badge.success {
            background: #dcfce7;
            color: #166534;
        }

        .status-badge.warning {
            background: #fef9c3;
            color: #854d0e;
        }

        .status-badge.danger {
            background: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>

<body>

    <div class="d-flex">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h5><i class="bi bi-boxes me-2"></i>Merchandising AI</h5>
                <small>18 modules · 60+ AI interactions</small>
            </div>
            <nav class="nav flex-column" id="moduleNav"></nav>
            <div class="mt-3 px-3 text-center text-white-50" style="font-size:0.75rem;">
                <i class="bi bi-shield-check me-1"></i> Mock AI – Presentation Demo
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content" id="mainContent"></div>
    </div>

    <!-- AI Modals -->
    <div class="modal fade" id="aiModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="aiModalLabel">AI Output</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="aiModalBody">...</div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ====== MODULE DEFINITIONS ======
        const modules = [
            { id: 'buyer-master', label: 'Buyer Master', icon: 'bi-person-badge' },
            { id: 'buyer-order-mgmt', label: 'Buyer Order Management', icon: 'bi-file-earmark-text' },
            { id: 'style-product-master', label: 'Style & Product Master', icon: 'bi-tags' },
            { id: 'order-booking', label: 'Order Booking', icon: 'bi-cart-check' },
            { id: 'ie-smv', label: 'IE & SMV Management', icon: 'bi-speedometer2' },
            { id: 'product-costing', label: 'Product Costing', icon: 'bi-calculator' },
            { id: 'cost-sheet', label: 'Cost Sheet', icon: 'bi-table' },
            { id: 'target-margin', label: 'Target Price & Margin', icon: 'bi-graph-up-arrow' },
            { id: 'order-budgeting', label: 'Order-wise Budgeting', icon: 'bi-wallet2' },
            { id: 'material-requirement', label: 'Material Requirement', icon: 'bi-box-seam' },
            { id: 'supplier-cs', label: 'Supplier CS', icon: 'bi-files' },
            { id: 'fabric-trims', label: 'Fabric & Trims Requirement', icon: 'bi-layers' },
            { id: 'sample-dev', label: 'Sample Development & Approval', icon: 'bi-flask' },
            { id: 'ta-calendar', label: 'T&A Calendar', icon: 'bi-calendar-event' },
            { id: 'production-followup', label: 'Production Follow-up', icon: 'bi-gear' },
            { id: 'shipment-planning', label: 'Shipment Planning', icon: 'bi-truck' },
            { id: 'order-status', label: 'Order Status', icon: 'bi-speedometer' },
            { id: 'profitability', label: 'Buyer-wise Profitability', icon: 'bi-coin' },
        ];

        // ====== HELPERS ======
        function showModal(title, html) {
            document.getElementById('aiModalLabel').textContent = title;
            document.getElementById('aiModalBody').innerHTML = html;
            const modal = new bootstrap.Modal(document.getElementById('aiModal'));
            modal.show();
        }

        function sendChat(containerId, inputId) {
            const input = document.getElementById(inputId);
            const msg = input.value.trim();
            if (!msg) return;
            const container = document.getElementById(containerId);
            const userDiv = document.createElement('div');
            userDiv.className = 'chat-msg user';
            userDiv.textContent = msg;
            container.appendChild(userDiv);
            input.value = '';
            setTimeout(() => {
                const aiDiv = document.createElement('div');
                aiDiv.className = 'chat-msg ai';
                const responses = [
                    'I found 3 relevant records. Here is the summary...',
                    'Current status: In Production. Estimated completion: 2026-09-10.',
                    'Risk detected: material shortage. Suggested action: expedite PO #PO-456.',
                    'Total orders: 12, Value: $245K, Avg margin: 14.2%.',
                    'Draft response prepared. Please review before sending.',
                    'Based on historical data, the forecast for next month is +8% volume.',
                    'Compliance check passed. All documents are in order.',
                    'Sentiment analysis shows positive feedback from this buyer.',
                ];
                aiDiv.textContent = responses[Math.floor(Math.random() * responses.length)];
                container.appendChild(aiDiv);
                container.scrollTop = container.scrollHeight;
            }, 700);
        }

        // ====== NEW SIMULATION FUNCTIONS ======
        function simulateSentiment(resultId) {
            const el = document.getElementById(resultId);
            if (el) { el.style.display = 'block'; el.scrollIntoView({ behavior: 'smooth' }); }
        }
        function simulateImageAnalysis(resultId) {
            const el = document.getElementById(resultId);
            if (el) { el.style.display = 'block'; el.scrollIntoView({ behavior: 'smooth' }); }
        }
        function simulateForecast(resultId) {
            const el = document.getElementById(resultId);
            if (el) { el.style.display = 'block'; el.scrollIntoView({ behavior: 'smooth' }); }
        }
        function simulateDynamicPricing(resultId) {
            const el = document.getElementById(resultId);
            if (el) { el.style.display = 'block'; el.scrollIntoView({ behavior: 'smooth' }); }
        }
        function simulateCompliance(resultId) {
            const el = document.getElementById(resultId);
            if (el) { el.style.display = 'block'; el.scrollIntoView({ behavior: 'smooth' }); }
        }
        function simulateAlternativeMaterial(resultId) {
            const el = document.getElementById(resultId);
            if (el) { el.style.display = 'block'; el.scrollIntoView({ behavior: 'smooth' }); }
        }
        function simulateRouteOptimization(resultId) {
            const el = document.getElementById(resultId);
            if (el) { el.style.display = 'block'; el.scrollIntoView({ behavior: 'smooth' }); }
        }
        function simulateDraftEmail(resultId) {
            const el = document.getElementById(resultId);
            if (el) { el.style.display = 'block'; el.scrollIntoView({ behavior: 'smooth' }); }
        }
        // Reuse existing sims
        function simulateEnrichment() { document.getElementById('enrichmentResult').style.display = 'grid'; }
        function simulatePOExtract() { document.getElementById('poExtractResult').style.display = 'block'; }
        function simulateAmendment() { document.getElementById('amendmentResult').style.display = 'block'; }
        function simulateTechPack() { document.getElementById('techPackResult').style.display = 'block'; }
        function simulatePublish() { document.getElementById('publishResult').style.display = 'block'; }
        function simulateTNAGeneration() {
            const el = document.getElementById('tnaGenResult') || document.getElementById('tnaResult');
            if (el) el.style.display = 'block';
        }
        function simulateCostSheet() { document.getElementById('costSheetResult').style.display = 'block'; }
        function updateMargin(val) {
            const price = parseFloat(val);
            document.getElementById('targetPriceDisplay').textContent = '$' + price.toFixed(2);
            const cost = 7.54;
            const margin = ((price - cost) / price * 100);
            document.getElementById('marginDisplay').textContent = margin.toFixed(1) + '%';
        }
        function simulateBudgetPrefill() { document.getElementById('budgetResult').style.display = 'block'; }
        function simulateQuoteExtract() { document.getElementById('quoteResult').style.display = 'block'; }
        function simulateFeedback() { document.getElementById('feedbackResult').style.display = 'block'; }
        function simulateTaskGen() { document.getElementById('taskResult').style.display = 'block'; }
        function simulateCommercialDraft() { document.getElementById('commercialResult').style.display = 'block'; }
        // New: Smart scheduling
        function simulateSmartScheduling(resultId) {
            const el = document.getElementById(resultId);
            if (el) el.style.display = 'block';
        }
        // New: Predictive quality
        function simulatePredictQuality(resultId) {
            const el = document.getElementById(resultId);
            if (el) el.style.display = 'block';
        }

        // ====== BUILD PANES (EXPANDED) ======
        function buildPane(moduleId) {
            const panes = {
                'buyer-master': `
                <div class="module-title">Buyer Master <span class="badge-ai ms-2"><i class="bi bi-robot"></i> AI</span></div>
                <div class="module-sub">Enrichment, risk scoring, sentiment analysis, compliance, and Q&A.</div>
                <!-- 1. Enrichment -->
                <div class="demo-card">
                    <h6><i class="bi bi-upload me-2"></i> AI Enrichment from Contract</h6>
                    <button class="btn btn-ai btn-sm" onclick="simulateEnrichment()">Simulate Upload</button>
                    <div id="enrichmentResult" class="extract-grid mt-3" style="display:none;">
                        <div class="extract-item"><div class="label">Payment Terms</div><div class="value">Net 60</div></div>
                        <div class="extract-item"><div class="label">Incoterm</div><div class="value">FOB</div></div>
                        <div class="extract-item"><div class="label">Lead Time</div><div class="value">45 days</div></div>
                        <div class="extract-item"><div class="label">Currency</div><div class="value">USD</div></div>
                    </div>
                </div>
                <!-- 2. Risk -->
                <div class="demo-card">
                    <h6><i class="bi bi-shield-exclamation me-2"></i> Buyer Risk Score</h6>
                    <div class="d-flex align-items-center gap-4">
                        <div style="width:120px;"><div class="risk-gauge"><div class="fill warning" style="width:68%;"></div></div><div class="d-flex justify-content-between small"><span>Low</span><span class="fw-bold">Medium (68)</span><span>High</span></div></div>
                        <div><span class="badge bg-warning text-dark">Risk factors:</span> 2 delayed payments, 1 amendment. <button class="btn btn-sm btn-outline-ai" onclick="showModal('Risk Analysis','AI Analysis: 68% risk score due to payment delays and amendments. Monitor shipments closely.')">Explain</button></div>
                    </div>
                </div>
                <!-- 3. Sentiment -->
                <div class="demo-card">
                    <h6><i class="bi bi-chat-quote me-2"></i> Sentiment Analysis on Emails</h6>
                    <button class="btn btn-ai btn-sm" onclick="simulateSentiment('buyerSentimentResult')">Analyze Latest Email</button>
                    <div id="buyerSentimentResult" style="display:none;" class="mt-2"><span class="badge bg-success">Positive</span> – Buyer is eager to place orders. Recommended: expedite quoting.</div>
                </div>
                <!-- 4. Compliance -->
                <div class="demo-card">
                    <h6><i class="bi bi-check-all me-2"></i> Compliance Check</h6>
                    <button class="btn btn-ai btn-sm" onclick="simulateCompliance('buyerComplianceResult')">Run Compliance</button>
                    <div id="buyerComplianceResult" style="display:none;" class="mt-2"><span class="badge bg-success">Passed</span> – All buyer-specific quality & packing requirements are met.</div>
                </div>
                <!-- 5. Chat -->
                <div class="demo-card">
                    <h6><i class="bi bi-chat-dots me-2"></i> Buyer Q&A</h6>
                    <div class="chat-box" id="buyerChatContainer"></div>
                    <div class="input-group mt-2"><input type="text" class="form-control" id="buyerChatInput" placeholder="e.g. Show packing instructions" /><button class="btn btn-ai" onclick="sendChat('buyerChatContainer','buyerChatInput')">Ask</button></div>
                </div>
            `,

                'buyer-order-mgmt': `
                <div class="module-title">Buyer Order Management <span class="badge-ai ms-2"><i class="bi bi-robot"></i> AI</span></div>
                <div class="module-sub">PO extraction, amendment impact, duplicate detection, delivery prediction, draft ack.</div>
                <div class="demo-card">
                    <h6><i class="bi bi-file-pdf me-2"></i> PO Extraction</h6>
                    <button class="btn btn-ai btn-sm" onclick="simulatePOExtract()">Simulate PO Upload</button>
                    <div id="poExtractResult" style="display:none;" class="mt-3"><div class="extract-grid">
                        <div class="extract-item"><div class="label">PO #</div><div class="value">PO-2026-0089</div></div>
                        <div class="extract-item"><div class="label">Buyer</div><div class="value">H&M</div></div>
                        <div class="extract-item"><div class="label">Style</div><div class="value">ST-1256</div></div>
                        <div class="extract-item"><div class="label">Qty</div><div class="value">5,200</div></div>
                        <div class="extract-item"><div class="label">Price</div><div class="value">$12.50</div></div>
                        <div class="extract-item"><div class="label">Ship Date</div><div class="value">2026-10-15</div></div>
                    </div><div class="mt-2 text-success"><i class="bi bi-check-circle"></i> Draft order created (92% confidence)</div></div>
                </div>
                <div class="demo-card">
                    <h6><i class="bi bi-arrow-repeat me-2"></i> Amendment Impact</h6>
                    <button class="btn btn-outline-ai btn-sm" onclick="simulateAmendment()">Analyze Qty Change</button>
                    <div id="amendmentResult" style="display:none;" class="mt-3"><table class="table table-sm comparison-table"><tr><th>Area</th><th>Before</th><th>After</th><th>Delta</th></tr><tr><td>Value</td><td>$65,000</td><td>$75,000</td><td class="delta positive">+$10k</td></tr><tr><td>Fabric</td><td>1,200m</td><td>1,385m</td><td class="delta positive">+185m</td></tr><tr><td>Ship Date</td><td>Oct 15</td><td>Oct 20</td><td class="delta negative">+5d</td></tr></table><div class="alert alert-info">AI: Re-budget and re-book materials.</div></div>
                </div>
                <div class="demo-card">
                    <h6><i class="bi bi-calendar-check me-2"></i> Predict Delivery Date</h6>
                    <button class="btn btn-ai btn-sm" onclick="simulateForecast('deliveryForecastResult')">Predict</button>
                    <div id="deliveryForecastResult" style="display:none;" class="mt-2"><span class="badge bg-primary">Predicted: Oct 17</span> (90% confidence interval: Oct 15–19)</div>
                </div>
                <div class="demo-card">
                    <h6><i class="bi bi-envelope-paper me-2"></i> Draft Acknowledgment</h6>
                    <button class="btn btn-ai btn-sm" onclick="simulateDraftEmail('ackDraftResult')">Generate Draft</button>
                    <div id="ackDraftResult" style="display:none;" class="mt-2"><div class="border p-2 bg-light">Dear Buyer, we acknowledge receipt of PO-2026-0089. We will ship by Oct 15 as requested.</div></div>
                </div>
                <div class="demo-card"><h6><i class="bi bi-exclamation-triangle me-2"></i> Duplicate Alert</h6><div class="alert alert-warning">Potential duplicate PO #PO-2026-0089 (similar to #PO-2026-0078). <button class="btn btn-sm btn-outline-ai" onclick="showModal('Duplicate','Same buyer, style, qty. Please verify.')">Review</button></div></div>
            `,

                'style-product-master': `
                <div class="module-title">Style & Product Master <span class="badge-ai ms-2"><i class="bi bi-robot"></i> AI</span></div>
                <div class="module-sub">Tech pack extraction, similarity, image analysis, auto-publish, size grading.</div>
                <div class="demo-card"><h6><i class="bi bi-file-earmark-code me-2"></i> Tech Pack Extraction</h6><button class="btn btn-ai btn-sm" onclick="simulateTechPack()">Simulate Upload</button><div id="techPackResult" style="display:none;" class="mt-3"><div class="extract-grid"><div class="extract-item"><div class="label">Garment</div><div class="value">T-Shirt</div></div><div class="extract-item"><div class="label">Fabric</div><div class="value">100% Cotton, 180 GSM</div></div><div class="extract-item"><div class="label">Sizes</div><div class="value">S,M,L,XL</div></div><div class="extract-item"><div class="label">Wash</div><div class="value">Enzyme</div></div></div><div class="text-success">Draft style created</div></div></div>
                <div class="demo-card"><h6><i class="bi bi-diagram-3 me-2"></i> Similarity</h6><div class="similarity-card"><strong>ST-0987</strong> <span class="match">85% match</span> – Same buyer, similar fabric. <button class="btn btn-sm btn-outline-ai" onclick="showModal('Comparison','Differences: embroidery vs. no embroidery.')">View</button></div><div class="similarity-card"><strong>ST-1123</strong> <span class="match">72% match</span> – Different buyer, similar category.</div></div>
                <div class="demo-card"><h6><i class="bi bi-image me-2"></i> Image Analysis (Mock)</h6><div class="image-placeholder"><i class="bi bi-image"></i><span>Sample Image</span></div><button class="btn btn-ai btn-sm mt-2" onclick="simulateImageAnalysis('imageAnalysisResult')">Analyze for Defects</button><div id="imageAnalysisResult" style="display:none;" class="mt-2"><span class="badge bg-success">No defects detected</span> – Fabric texture matches specification.</div></div>
                <div class="demo-card"><h6><i class="bi bi-arrows-expand me-2"></i> Auto Size Grading</h6><button class="btn btn-ai btn-sm" onclick="simulateForecast('sizeGradingResult')">Generate Grades</button><div id="sizeGradingResult" style="display:none;" class="mt-2">S: 25%, M: 30%, L: 25%, XL: 20% (based on historical ratios).</div></div>
                <div class="demo-card"><h6><i class="bi bi-globe me-2"></i> Auto-Publish</h6><button class="btn btn-ai btn-sm" onclick="simulatePublish()">Publish</button><div id="publishResult" style="display:none;" class="mt-2"><span class="badge bg-success">Published to CMS v2.1</span></div></div>

                <div class="demo-card"><h6><i class="bi bi-check-circle me-2"></i> Customs Clearance</h6><button class="btn btn-ai btn-sm" onclick="simulateForecast('customsResult')">Predict Status</button><div id="customsResult" style="display:none;" class="mt-2"><span class="badge bg-success">Clearance predicted on Oct 6</span> – All documents are in order.</div></div>
            `,

                'order-status': `
                <div class="module-title">Order Status <span class="badge-ai ms-2"><i class="bi bi-robot"></i> AI</span></div>
                <div class="module-sub">Copilot Q&A, daily summary, risk cards, proactive alerts, predictive hold release.</div>
                <div class="demo-card"><h6><i class="bi bi-robot me-2"></i> Copilot Q&A</h6><div class="chat-box" id="statusChatContainer"></div><div class="input-group mt-2"><input type="text" class="form-control" id="statusChatInput" placeholder="Orders on hold?" /><button class="btn btn-ai" onclick="sendChat('statusChatContainer','statusChatInput')">Ask</button></div></div>
                <div class="demo-card"><h6><i class="bi bi-file-earmark-text me-2"></i> Daily Summary</h6><div class="alert alert-secondary"><strong>Today:</strong> 5 TNA overdue, 3 samples pending, 2 shortages. <button class="btn btn-sm btn-outline-ai">View</button></div></div>
                <div class="demo-card"><h6><i class="bi bi-grid me-2"></i> Risk Cards</h6><div class="d-flex flex-wrap gap-2"><span class="badge bg-danger p-2">Material Delay: 2</span><span class="badge bg-warning p-2">Approval Delay: 5</span><span class="badge bg-success p-2">On Track: 12</span></div></div>
                <div class="demo-card"><h6><i class="bi bi-bell me-2"></i> Proactive Alerts</h6><button class="btn btn-ai btn-sm" onclick="simulateForecast('alertResult')">Configure Alerts</button><div id="alertResult" style="display:none;" class="mt-2">AI will alert you when Order #123 hits "Material Shortage" status.</div></div>
                <div class="demo-card"><h6><i class="bi bi-clock me-2"></i> Predictive Hold Release</h6><button class="btn btn-ai btn-sm" onclick="simulateSmartScheduling('holdResult')">Check Hold Status</button><div id="holdResult" style="display:none;" class="mt-2">AI predicts Order #456 will be released from hold on Sep 8 (material expected Sep 7).</div></div>
            `,

                'profitability': `
                <div class="module-title">Buyer-wise Profitability <span class="badge-ai ms-2"><i class="bi bi-robot"></i> AI</span></div>
                <div class="module-sub">Final summary, variance explanation, benchmarking, forecast next quarter, CLV prediction.</div>
                <div class="demo-card"><h6><i class="bi bi-coin me-2"></i> Final Summary</h6><table class="table table-sm"><tr><th>Order</th><th>Budget</th><th>Actual</th><th>Variance</th></tr><tr><td>ORD-123</td><td>$39,208</td><td>$40,150</td><td class="delta negative">-$942</td></tr><tr><td>ORD-124</td><td>$52,000</td><td>$51,200</td><td class="delta positive">+$800</td></tr></table></div>
                <div class="demo-card"><h6><i class="bi bi-question-circle me-2"></i> Variance Explain</h6><button class="btn btn-sm btn-outline-ai" onclick="showModal('Variance','Fabric actual $3.35 vs budget $3.20 → +$982.80. Partially offset by washing savings.')">Explain</button></div>
                <div class="demo-card"><h6><i class="bi bi-database me-2"></i> Benchmarking</h6><div class="chat-box" id="profitChatContainer"></div><div class="input-group mt-2"><input type="text" class="form-control" id="profitChatInput" placeholder="Which buyer had highest margin?" /><button class="btn btn-ai" onclick="sendChat('profitChatContainer','profitChatInput')">Ask</button></div></div>
                <div class="demo-card"><h6><i class="bi bi-graph-up-arrow me-2"></i> Forecast Next Quarter</h6><button class="btn btn-ai btn-sm" onclick="simulateForecast('qForecastResult')">Forecast</button><div id="qForecastResult" style="display:none;" class="mt-2">Projected margin for Q4: 42% (+3% vs current).</div></div>
                <div class="demo-card"><h6><i class="bi bi-heart me-2"></i> Customer Lifetime Value</h6><button class="btn btn-ai btn-sm" onclick="simulateDynamicPricing('clvResult')">Predict CLV</button><div id="clvResult" style="display:none;" class="mt-2">Buyer H&M estimated CLV: $2.4M (High value buyer).</div></div>
            `
            };
            return panes[moduleId] || `<div class="module-title">Module not found</div>`;
        }

        // ====== INIT ======
        document.addEventListener('DOMContentLoaded', function () {
            const nav = document.getElementById('moduleNav');
            const main = document.getElementById('mainContent');

            modules.forEach((mod, idx) => {
                const link = document.createElement('a');
                link.className = 'module-link' + (idx === 0 ? ' active' : '');
                link.setAttribute('data-module', mod.id);
                link.innerHTML = `<i class="bi ${mod.icon}"></i> ${mod.label}`;
                link.addEventListener('click', function (e) {
                    e.preventDefault();
                    document.querySelectorAll('.module-link').forEach(l => l.classList.remove('active'));
                    this.classList.add('active');
                    document.querySelectorAll('.module-pane').forEach(p => p.classList.remove('active'));
                    const pane = document.getElementById('pane-' + mod.id);
                    if (pane) pane.classList.add('active');
                });
                nav.appendChild(link);

                const pane = document.createElement('div');
                pane.className = 'module-pane' + (idx === 0 ? ' active' : '');
                pane.id = 'pane-' + mod.id;
                pane.innerHTML = buildPane(mod.id);
                main.appendChild(pane);
            });

            // Init chat boxes
            document.querySelectorAll('.chat-box:empty').forEach(c => {
                const div = document.createElement('div');
                div.className = 'chat-msg ai';
                div.textContent = 'Hello! How can I assist you?';
                c.appendChild(div);
            });
        });
    </script>
</body>

</html>
