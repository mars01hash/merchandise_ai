<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RMG ERP – Merchandising AI Demo</title>
    <!-- Bootstrap + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f6f9;
        }

        .sidebar {
            height: 100vh;
            background: #0d1b2a;
            color: #ecf0f1;
            padding-top: 20px;
            overflow-y: auto;
            position: sticky;
            top: 0;
            width: 260px;
            flex-shrink: 0;
        }

        .sidebar .module-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            color: #b0c4de;
            text-decoration: none;
            border-left: 3px solid transparent;
            transition: 0.2s;
            cursor: pointer;
        }

        .sidebar .module-link:hover,
        .sidebar .module-link.active {
            background: #1b2a41;
            color: #ffffff;
            border-left-color: #4a9eff;
        }

        .sidebar .module-link i {
            font-size: 1.2rem;
            width: 24px;
            text-align: center;
        }

        .main-content {
            padding: 30px 25px;
            overflow-y: auto;
            height: 100vh;
            flex: 1;
        }

        .module-pane {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .module-pane.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .demo-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
            padding: 24px;
            margin-bottom: 24px;
            transition: 0.2s;
            border: 1px solid #e9edf4;
        }

        .demo-card:hover {
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.08);
        }

        .badge-ai {
            background: #7c3aed;
            color: white;
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 20px;
            letter-spacing: 0.3px;
        }

        .btn-ai {
            background: #7c3aed;
            border: none;
            color: white;
            transition: 0.2s;
        }

        .btn-ai:hover {
            background: #5b21b6;
            color: white;
        }

        .btn-outline-ai {
            border-color: #7c3aed;
            color: #7c3aed;
        }

        .btn-outline-ai:hover {
            background: #7c3aed;
            color: white;
        }

        .chat-box {
            background: #f8fafc;
            border-radius: 12px;
            padding: 15px;
            max-height: 200px;
            overflow-y: auto;
        }

        .chat-msg {
            margin-bottom: 10px;
            padding: 8px 14px;
            border-radius: 18px;
            max-width: 85%;
        }

        .chat-msg.user {
            background: #e2e8f0;
            align-self: flex-end;
            margin-left: auto;
        }

        .chat-msg.ai {
            background: #dbeafe;
            align-self: flex-start;
        }

        .extract-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
        }

        .extract-item {
            background: #f1f5f9;
            padding: 10px 14px;
            border-radius: 8px;
            border-left: 4px solid #7c3aed;
        }

        .extract-item .label {
            font-size: 0.75rem;
            color: #475569;
            font-weight: 600;
            text-transform: uppercase;
        }

        .extract-item .value {
            font-size: 1rem;
            font-weight: 500;
        }

        .risk-gauge {
            width: 100%;
            height: 12px;
            background: #e2e8f0;
            border-radius: 12px;
            margin: 8px 0;
        }

        .risk-gauge .fill {
            height: 100%;
            border-radius: 12px;
            background: #22c55e;
        }

        .risk-gauge .fill.warning {
            background: #eab308;
        }

        .risk-gauge .fill.danger {
            background: #ef4444;
        }

        .similarity-card {
            border: 1px solid #e9edf4;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .similarity-card .match {
            color: #7c3aed;
            font-weight: 600;
        }

        .status-badge {
            background: #dbeafe;
            color: #1e40af;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        .status-badge.success {
            background: #dcfce7;
            color: #166534;
        }

        .status-badge.warning {
            background: #fef9c3;
            color: #854d0e;
        }

        .status-badge.danger {
            background: #fee2e2;
            color: #991b1b;
        }

        .comparison-table td {
            vertical-align: middle;
        }

        .comparison-table .delta {
            font-weight: 600;
        }

        .delta.positive {
            color: #16a34a;
        }

        .delta.negative {
            color: #dc2626;
        }

        .sidebar-header {
            padding: 0 20px 20px 20px;
            border-bottom: 1px solid #2a3a4f;
            margin-bottom: 12px;
        }

        .sidebar-header h5 {
            color: #f1f5f9;
            font-weight: 600;
        }

        .sidebar-header small {
            color: #94a3b8;
        }

        .module-title {
            font-size: 1.6rem;
            font-weight: 600;
            color: #0f172a;
        }

        .module-sub {
            color: #475569;
            margin-bottom: 20px;
        }

        .loading-dots::after {
            content: '...';
            animation: dots 1.2s steps(4) infinite;
        }

        @keyframes dots {
            0% {
                content: '';
            }

            25% {
                content: '.';
            }

            50% {
                content: '..';
            }

            75% {
                content: '...';
            }
        }

        .pulse-glow {
            animation: pulse 1.8s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(124, 58, 237, 0.2);
            }

            50% {
                box-shadow: 0 0 0 8px rgba(124, 58, 237, 0);
            }
        }

        /* scrollbar */
        .sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: #2d4a6b;
            border-radius: 8px;
        }

        .sidebar::-webkit-scrollbar-track {
            background: transparent;
        }
    </style>
</head>

<body>

    <div class="d-flex">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h5><i class="bi bi-boxes me-2"></i>Merchandising AI</h5>
                <small>18 modules · Demo</small>
            </div>
            <nav class="nav flex-column" id="moduleNav">
                <!-- Links will be generated by JS -->
            </nav>
            <div class="mt-3 px-3 text-center text-white-50" style="font-size:0.75rem;">
                <i class="bi bi-shield-check me-1"></i> Mock AI – for presentation
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content" id="mainContent">
            <!-- Panes will be injected by JS -->
        </div>
    </div>

    <!-- AI Modals -->
    <div class="modal fade" id="aiModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="aiModalLabel">AI Output</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="aiModalBody">
                    ...
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // ====== MODULE DEFINITIONS ======
        const modules = [
            { id: 'buyer-master', label: 'Buyer Master', icon: 'bi-person-badge' },
            { id: 'buyer-order-mgmt', label: 'Buyer Order Management', icon: 'bi-file-earmark-text' },
            { id: 'style-product-master', label: 'Style & Product Master', icon: 'bi-tags' },
            { id: 'order-booking', label: 'Order Booking', icon: 'bi-cart-check' },
            { id: 'ie-smv', label: 'IE & SMV Management', icon: 'bi-speedometer2' },
            { id: 'product-costing', label: 'Product Costing', icon: 'bi-calculator' },
            { id: 'cost-sheet', label: 'Cost Sheet', icon: 'bi-table' },
            { id: 'target-margin', label: 'Target Price & Margin', icon: 'bi-graph-up-arrow' },
            { id: 'order-budgeting', label: 'Order-wise Budgeting', icon: 'bi-wallet2' },
            { id: 'material-requirement', label: 'Material Requirement', icon: 'bi-box-seam' },
            { id: 'supplier-cs', label: 'Supplier CS', icon: 'bi-files' },
            { id: 'fabric-trims', label: 'Fabric & Trims Requirement', icon: 'bi-layers' },
            { id: 'sample-dev', label: 'Sample Development & Approval', icon: 'bi-flask' },
            { id: 'ta-calendar', label: 'T&A Calendar', icon: 'bi-calendar-event' },
            { id: 'production-followup', label: 'Production Follow-up', icon: 'bi-gear' },
            { id: 'shipment-planning', label: 'Shipment Planning', icon: 'bi-truck' },
            { id: 'order-status', label: 'Order Status', icon: 'bi-speedometer' },
            { id: 'profitability', label: 'Buyer-wise Profitability', icon: 'bi-coin' },
        ];

        // ====== HELPERS ======
        function showModal(title, html) {
            document.getElementById('aiModalLabel').textContent = title;
            document.getElementById('aiModalBody').innerHTML = html;
            const modal = new bootstrap.Modal(document.getElementById('aiModal'));
            modal.show();
        }

        function simulateLoading(callback) {
            const btn = event.target;
            const original = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Processing...';
            setTimeout(() => {
                btn.innerHTML = original;
                btn.disabled = false;
                callback();
            }, 1200);
        }

        // Chat helper
        function sendChat(moduleId, inputId, responseId) {
            const input = document.getElementById(inputId);
            const msg = input.value.trim();
            if (!msg) return;
            const container = document.getElementById(responseId);
            // Add user message
            const userDiv = document.createElement('div');
            userDiv.className = 'chat-msg user';
            userDiv.textContent = msg;
            container.appendChild(userDiv);
            input.value = '';
            // Simulate AI response
            setTimeout(() => {
                const aiDiv = document.createElement('div');
                aiDiv.className = 'chat-msg ai';
                const responses = [
                    'Based on the data, I found 3 relevant records. Would you like to see them?',
                    'The current status for that order is "In Production". Estimated completion: 2026-09-10.',
                    'I see a potential risk: material shortage for Fabric X. Suggested action: expedite PO #PO-456.',
                    'Here is the summary: total orders 12, value $245K, average margin 14.2%.',
                    'I have prepared a draft response for you. Please review it before sending.',
                ];
                aiDiv.textContent = responses[Math.floor(Math.random() * responses.length)];
                container.appendChild(aiDiv);
                container.scrollTop = container.scrollHeight;
            }, 800);
        }

        // ====== BUILD MODULE PANES ======
        function buildPane(moduleId) {
            // Each module returns HTML with AI demos
            const panes = {
                'buyer-master': `
                <div class="module-title">Buyer Master <span class="badge-ai ms-2"><i class="bi bi-robot"></i> AI</span></div>
                <div class="module-sub">Intelligent buyer profile enrichment, risk scoring, and compliance Q&A.</div>

                <div class="demo-card">
                    <h6><i class="bi bi-upload me-2"></i> AI Enrichment from Contract</h6>
                    <p class="text-muted small">Upload a buyer contract to auto-extract commercial terms.</p>
                    <div class="d-flex gap-2 mb-3">
                        <button class="btn btn-ai btn-sm" onclick="simulateEnrichment()"><i class="bi bi-file-earmark-text"></i> Simulate Upload</button>
                    </div>
                    <div id="enrichmentResult" class="extract-grid" style="display:none;">
                        <div class="extract-item"><div class="label">Payment Terms</div><div class="value">Net 60</div></div>
                        <div class="extract-item"><div class="label">Incoterm</div><div class="value">FOB</div></div>
                        <div class="extract-item"><div class="label">Lead Time</div><div class="value">45 days</div></div>
                        <div class="extract-item"><div class="label">Currency</div><div class="value">USD</div></div>
                    </div>
                </div>

                <div class="demo-card">
                    <h6><i class="bi bi-shield-exclamation me-2"></i> Buyer Risk Score</h6>
                    <div class="d-flex align-items-center gap-4">
                        <div style="width:120px;">
                            <div class="risk-gauge"><div class="fill warning" style="width:68%;"></div></div>
                            <div class="d-flex justify-content-between small"><span>Low</span><span class="fw-bold">Medium (68)</span><span>High</span></div>
                        </div>
                        <div>
                            <span class="badge bg-warning text-dark">Risk factors:</span> 2 delayed payments, 1 amendment in last 6 months.
                            <button class="btn btn-outline-ai btn-sm ms-2" onclick="showModal('Risk Analysis','<p>AI Analysis: Buyer has a 68% risk score due to recent payment delays and order amendments. Recommended: monitor shipments closely and request upfront payment for high-value orders.</p>')">Explain</button>
                        </div>
                    </div>
                </div>

                <div class="demo-card">
                    <h6><i class="bi bi-chat-dots me-2"></i> Compliance Q&A</h6>
                    <div class="chat-box" id="buyerChatContainer" style="max-height:150px;"></div>
                    <div class="input-group mt-2">
                        <input type="text" class="form-control" id="buyerChatInput" placeholder="e.g. Show packing instructions for Buyer X" />
                        <button class="btn btn-ai" onclick="sendChat('buyer','buyerChatInput','buyerChatContainer')">Ask</button>
                    </div>
                </div>
            `,

                'buyer-order-mgmt': `
                <div class="module-title">Buyer Order Management <span class="badge-ai ms-2"><i class="bi bi-robot"></i> AI</span></div>
                <div class="module-sub">Intelligent PO extraction, amendment impact, and duplicate detection.</div>

                <div class="demo-card">
                    <h6><i class="bi bi-file-pdf me-2"></i> PO Extraction</h6>
                    <p class="text-muted small">Upload a buyer PO (PDF/Image) – AI extracts key fields.</p>
                    <button class="btn btn-ai btn-sm" onclick="simulatePOExtract()"><i class="bi bi-upload"></i> Simulate PO Upload</button>
                    <div id="poExtractResult" style="display:none;" class="mt-3">
                        <div class="extract-grid">
                            <div class="extract-item"><div class="label">PO Number</div><div class="value">PO-2026-0089</div></div>
                            <div class="extract-item"><div class="label">Buyer</div><div class="value">H&M</div></div>
                            <div class="extract-item"><div class="label">Style</div><div class="value">ST-1256</div></div>
                            <div class="extract-item"><div class="label">Quantity</div><div class="value">5,200 pcs</div></div>
                            <div class="extract-item"><div class="label">Unit Price</div><div class="value">$12.50</div></div>
                            <div class="extract-item"><div class="label">Ship Date</div><div class="value">2026-10-15</div></div>
                        </div>
                        <div class="mt-2 text-success"><i class="bi bi-check-circle"></i> Draft order created with 92% confidence</div>
                    </div>
                </div>

                <div class="demo-card">
                    <h6><i class="bi bi-arrow-repeat me-2"></i> Amendment Impact Analysis</h6>
                    <p>Simulate a quantity change from 5,200 → 6,000 pcs.</p>
                    <button class="btn btn-outline-ai btn-sm" onclick="simulateAmendment()">Analyze Impact</button>
                    <div id="amendmentResult" style="display:none;" class="mt-3">
                        <table class="table table-sm comparison-table">
                            <tr><th>Area</th><th>Before</th><th>After</th><th>Delta</th></tr>
                            <tr><td>Order Value</td><td>$65,000</td><td>$75,000</td><td class="delta positive">+$10,000</td></tr>
                            <tr><td>Fabric Booking</td><td>1,200 m</td><td>1,385 m</td><td class="delta positive">+185 m</td></tr>
                            <tr><td>TNA (Shipment)</td><td>Oct 15</td><td>Oct 20</td><td class="delta negative">+5 days</td></tr>
                        </table>
                        <div class="alert alert-info">AI Recommendation: Re-budget and re-book materials. Notify Production.</div>
                    </div>
                </div>

                <div class="demo-card">
                    <h6><i class="bi bi-exclamation-triangle me-2"></i> Duplicate PO Alert</h6>
                    <div class="alert alert-warning">AI detected a potential duplicate PO #PO-2026-0089 (similar to #PO-2026-0078). <button class="btn btn-sm btn-outline-ai" onclick="showModal('Duplicate Check','Both POs have same buyer, style, and quantity. Please verify if this is a duplicate or a revision.')">Review</button></div>
                </div>
            `,

                'style-product-master': `
                <div class="module-title">Style & Product Master <span class="badge-ai ms-2"><i class="bi bi-robot"></i> AI</span></div>
                <div class="module-sub">Tech pack extraction, previous-style similarity, and auto-publish.</div>

                <div class="demo-card">
                    <h6><i class="bi bi-file-earmark-code me-2"></i> Tech Pack Extraction</h6>
                    <button class="btn btn-ai btn-sm" onclick="simulateTechPack()">Simulate Tech Pack Upload</button>
                    <div id="techPackResult" style="display:none;" class="mt-3">
                        <div class="extract-grid">
                            <div class="extract-item"><div class="label">Garment Type</div><div class="value">T-Shirt</div></div>
                            <div class="extract-item"><div class="label">Fabric</div><div class="value">100% Cotton, 180 GSM</div></div>
                            <div class="extract-item"><div class="label">Construction</div><div class="value">Single Jersey</div></div>
                            <div class="extract-item"><div class="label">Sizes</div><div class="value">S,M,L,XL</div></div>
                            <div class="extract-item"><div class="label">Wash</div><div class="value">Enzyme Wash</div></div>
                            <div class="extract-item"><div class="label">Trims</div><div class="value">Labels, Polybag</div></div>
                        </div>
                        <div class="mt-2 text-success"><i class="bi bi-check-circle"></i> Draft style created with source links</div>
                    </div>
                </div>

                <div class="demo-card">
                    <h6><i class="bi bi-diagram-3 me-2"></i> Previous-Style Similarity</h6>
                    <p>AI found 2 similar styles based on the tech pack.</p>
                    <div class="similarity-card">
                        <div><strong>Style ST-0987</strong> <span class="match">85% match</span></div>
                        <div class="small text-muted">Same buyer, similar fabric, same wash. Differences: embroidery vs. no embroidery.</div>
                        <button class="btn btn-sm btn-outline-ai mt-1" onclick="showModal('Style Comparison','<b>ST-0987 vs New</b><br>+ Fabric: same<br>+ Wash: same<br>- Embroidery: New has embroidery<br>+ Trims: different label type')">View Differences</button>
                    </div>
                    <div class="similarity-card">
                        <div><strong>Style ST-1123</strong> <span class="match">72% match</span></div>
                        <div class="small text-muted">Different buyer, similar category, different GSM.</div>
                    </div>
                </div>

                <div class="demo-card">
                    <h6><i class="bi bi-globe me-2"></i> Auto-Publish to Website</h6>
                    <button class="btn btn-ai btn-sm" onclick="simulatePublish()">Simulate Publish</button>
                    <div id="publishResult" style="display:none;" class="mt-2">
                        <span class="badge bg-success"><i class="bi bi-check-circle"></i> Published successfully to CMS</span>
                        <div class="small text-muted">Version 2.1 · 2026-09-01 14:23</div>
                    </div>
                </div>
            `,

                'order-booking': `
                <div class="module-title">Order Booking <span class="badge-ai ms-2"><i class="bi bi-robot"></i> AI</span></div>
                <div class="module-sub">Mandatory field validation, breakdown prefill, and shipment feasibility.</div>

                <div class="demo-card">
                    <h6><i class="bi bi-check-all me-2"></i> Mandatory Field Check</h6>
                    <div class="alert alert-success">All mandatory fields are complete. AI validated 12 fields.</div>
                    <button class="btn btn-sm btn-outline-ai" onclick="showModal('Field Validation','AI validated: Buyer, Style, Quantity, Ship Date, Currency, PO#. Missing: Destination – please fill.')">Simulate Missing</button>
                </div>

                <div class="demo-card">
                    <h6><i class="bi bi-table me-2"></i> Color-Size Breakdown Suggestion</h6>
                    <p>AI pre-filled matrix based on historical ratios.</p>
                    <table class="table table-sm table-bordered">
                        <tr><th>Color</th><th>S</th><th>M</th><th>L</th><th>XL</th></tr>
                        <tr><td>Red</td><td>200</td><td>300</td><td>250</td><td>150</td></tr>
                        <tr><td>Blue</td><td>180</td><td>280</td><td>220</td><td>120</td></tr>
                        <tr><td>Black</td><td>220</td><td>320</td><td>280</td><td>180</td></tr>
                    </table>
                    <span class="badge bg-info">AI: based on previous order #ORD-4523</span>
                </div>

                <div class="demo-card">
                    <h6><i class="bi bi-calendar-check me-2"></i> Shipment Feasibility</h6>
                    <div class="d-flex align-items-center">
                        <span class="badge bg-danger me-2">High Risk</span>
                        <span>Requested ship date: Oct 15. Based on lead-time analysis, recommended date: Oct 25.</span>
                        <button class="btn btn-sm btn-outline-ai ms-2" onclick="showModal('Feasibility Details','Fabric procurement: 30 days, Production: 20 days, Testing: 5 days. Total min lead time: 55 days. Requested: 40 days.')">Explain</button>
                    </div>
                </div>
            `,

                'ie-smv': `
                <div class="module-title">IE & SMV Management <span class="badge-ai ms-2"><i class="bi bi-robot"></i> AI</span></div>
                <div class="module-sub">SMV-based TNA, cost suggestions, and workload balancing.</div>

                <div class="demo-card">
                    <h6><i class="bi bi-clock me-2"></i> SMV-based TNA Generation</h6>
                    <p>SMV: 12.5 minutes · Order: 5,200 pcs</p>
                    <button class="btn btn-ai btn-sm" onclick="simulateTNAGeneration()">Generate TNA</button>
                    <div id="tnaGenResult" style="display:none;" class="mt-2">
                        <ul class="list-unstyled">
                            <li><i class="bi bi-check-circle text-success"></i> Cutting: Sep 1–5</li>
                            <li><i class="bi bi-check-circle text-success"></i> Sewing: Sep 6–18</li>
                            <li><i class="bi bi-check-circle text-success"></i> Finishing: Sep 19–24</li>
                            <li><i class="bi bi-check-circle text-success"></i> Packing: Sep 25–28</li>
                        </ul>
                        <div class="small text-muted">Based on SMV and historical line efficiency (85%)</div>
                    </div>
                </div>

                <div class="demo-card">
                    <h6><i class="bi bi-cash me-2"></i> SMV-cost Suggestion</h6>
                    <p>AI suggests CM rate: $2.45/pcs (based on SMV 12.5 and similar styles).</p>
                    <button class="btn btn-sm btn-outline-ai" onclick="showModal('CM Rate Suggestion','Historical CM rates for SMV 12-13: $2.30–$2.60. Suggested: $2.45. Accept?')">Review</button>

            const price = parseFloat(val);
            document.getElementById('targetPriceDisplay').textContent = '$' + price.toFixed(2);
            // Simulate margin: cost $7.54, margin = (price - cost)/price * 100

        function simulateTaskGen() {
            const el = document.getElementById('taskResult');
            if (el) { el.style.display = 'block'; el.scrollIntoView({ behavior: 'smooth' }); }
        }
        function simulateCommercialDraft() {
            const el = document.getElementById('commercialResult');
            if (el) { el.style.display = 'block'; el.scrollIntoView({ behavior: 'smooth' }); }
        }

        // ====== INIT ======
        document.addEventListener('DOMContentLoaded', function () {
            const nav = document.getElementById('moduleNav');
            const main = document.getElementById('mainContent');

            // Build nav and panes
            modules.forEach((mod, idx) => {
                const link = document.createElement('a');
                link.className = 'module-link' + (idx === 0 ? ' active' : '');
                link.setAttribute('data-module', mod.id);
                link.innerHTML = `<i class="bi ${mod.icon}"></i> ${mod.label}`;
                link.addEventListener('click', function (e) {
                    e.preventDefault();
                    // Update active nav
                    document.querySelectorAll('.module-link').forEach(l => l.classList.remove('active'));
                    this.classList.add('active');
                    // Show pane
                    document.querySelectorAll('.module-pane').forEach(p => p.classList.remove('active'));
                    const pane = document.getElementById('pane-' + mod.id);
                    if (pane) pane.classList.add('active');
                });
                nav.appendChild(link);

                // Pane
                const pane = document.createElement('div');
                pane.className = 'module-pane' + (idx === 0 ? ' active' : '');
                pane.id = 'pane-' + mod.id;
                pane.innerHTML = buildPane(mod.id);
                main.appendChild(pane);
            });

            // Chat initial messages for modules that have chat
            const chatContainers = document.querySelectorAll('.chat-box:empty');
            chatContainers.forEach(c => {
                const div = document.createElement('div');
                div.className = 'chat-msg ai';
                div.textContent = 'Hello! I’m your AI assistant. How can I help?';
                c.appendChild(div);
            });
        });
    </script>
</body>

</html>
