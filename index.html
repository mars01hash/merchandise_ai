<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RMG ERP – AI Error Reduction Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f6f9;
        }

        .sidebar {
            height: 100vh;
            background: #0d1b2a;
            color: #ecf0f1;
            padding-top: 20px;
            overflow-y: auto;
            position: sticky;
            top: 0;
            width: 260px;
            flex-shrink: 0;
        }

        .sidebar .module-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            color: #b0c4de;
            text-decoration: none;
            border-left: 3px solid transparent;
            transition: 0.2s;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .sidebar .module-link:hover,
        .sidebar .module-link.active {
            background: #1b2a41;
            color: #fff;
            border-left-color: #4a9eff;
        }

        .sidebar .module-link i {
            font-size: 1.2rem;
            width: 24px;
            text-align: center;
        }

        .main-content {
            padding: 30px 25px;
            overflow-y: auto;
            height: 100vh;
            flex: 1;
            background: #f4f6f9;
        }

        .module-pane {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .module-pane.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .demo-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
            padding: 24px;
            margin-bottom: 24px;
            border: 1px solid #e9edf4;
            transition: 0.2s;
        }

        .demo-card:hover {
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.08);
        }

        .badge-ai {
            background: #7c3aed;
            color: white;
            font-size: 0.7rem;
            padding: 4px 12px;
            border-radius: 20px;
            letter-spacing: 0.3px;
        }

        .badge-error {
            background: #dc2626;
            color: white;
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 20px;
        }

        .btn-ai {
            background: #7c3aed;
            border: none;
            color: white;
            transition: 0.2s;
        }

        .btn-ai:hover {
            background: #5b21b6;
            color: white;
        }

        .btn-outline-ai {
            border: 1px solid #7c3aed;
            color: #7c3aed;
            background: transparent;
        }

        .btn-outline-ai:hover {
            background: #7c3aed;
            color: white;
        }

        .chat-box {
            background: #f8fafc;
            border-radius: 12px;
            padding: 15px;
            max-height: 200px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .chat-msg {
            margin-bottom: 10px;
            padding: 8px 14px;
            border-radius: 18px;
            max-width: 85%;
            word-break: break-word;
        }

        .chat-msg.user {
            background: #e2e8f0;
            align-self: flex-end;
            margin-left: auto;
        }

        .chat-msg.ai {
            background: #dbeafe;
            align-self: flex-start;
        }

        .extract-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
        }

        .extract-item {
            background: #f1f5f9;
            padding: 10px 14px;
            border-radius: 8px;
            border-left: 4px solid #7c3aed;
        }

        .extract-item .label {
            font-size: 0.7rem;
            color: #475569;
            font-weight: 600;
            text-transform: uppercase;
        }

        .extract-item .value {
            font-size: 0.95rem;
            font-weight: 500;
        }

        .risk-gauge {
            width: 100%;
            height: 12px;
            background: #e2e8f0;
            border-radius: 12px;
            margin: 8px 0;
        }

        .risk-gauge .fill {
            height: 100%;
            border-radius: 12px;
            background: #22c55e;
        }

        .risk-gauge .fill.warning {
            background: #eab308;
        }

        .risk-gauge .fill.danger {
            background: #ef4444;
        }

        .similarity-card {
            border: 1px solid #e9edf4;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .comparison-table td {
            vertical-align: middle;
        }

        .delta.positive {
            color: #16a34a;
            font-weight: 600;
        }

        .delta.negative {
            color: #dc2626;
            font-weight: 600;
        }

        .sidebar-header {
            padding: 0 20px 20px 20px;
            border-bottom: 1px solid #2a3a4f;
            margin-bottom: 12px;
        }

        .sidebar-header h5 {
            color: #f1f5f9;
            font-weight: 600;
        }

        .sidebar-header small {
            color: #94a3b8;
        }

        .module-title {
            font-size: 1.6rem;
            font-weight: 600;
            color: #0f172a;
        }

        .module-sub {
            color: #475569;
            margin-bottom: 20px;
        }

        .error-reduction-card {
            background: #fef2f2;
            border-left: 5px solid #dc2626;
            padding: 16px;
            border-radius: 8px;
            margin-top: 12px;
        }

        .error-reduction-card .fixed {
            background: #dcfce7;
            border-left-color: #16a34a;
        }

        .metric-number {
            font-size: 2rem;
            font-weight: 700;
            color: #0f172a;
        }

        .metric-label {
            color: #475569;
            font-size: 0.9rem;
        }

        .sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: #2d4a6b;
            border-radius: 8px;
        }

        .sidebar::-webkit-scrollbar-track {
            background: transparent;
        }

        .toggle-manual-ai {
            cursor: pointer;
        }

        .manual-view {
            display: none;
        }

        .ai-view {
            display: block;
        }

        .show-manual .manual-view {
            display: block;
        }

        .show-manual .ai-view {
            display: none;
        }
    </style>
</head>

<body>

    <div class="d-flex">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h5><i class="bi bi-shield-check me-2"></i>Error Reduction AI</h5>
                <small>18 modules · Visual demo</small>
            </div>
            <nav class="nav flex-column" id="moduleNav"></nav>
            <div class="mt-3 px-3 text-center text-white-50" style="font-size:0.75rem;">
                <i class="bi bi-robot me-1"></i> AI reduces human error
            </div>
        </div>

        <!-- Main -->
        <div class="main-content" id="mainContent"></div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="aiModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="aiModalLabel">AI Insight</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="aiModalBody">...</div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ====== MODULES ======
        const modules = [
            { id: 'buyer-master', label: 'Buyer Master', icon: 'bi-person-badge' },
            { id: 'buyer-order', label: 'Buyer Order', icon: 'bi-file-earmark-text' },
            { id: 'style-master', label: 'Style Master', icon: 'bi-tags' },
            { id: 'order-booking', label: 'Order Booking', icon: 'bi-cart-check' },
            { id: 'ie-smv', label: 'IE & SMV', icon: 'bi-speedometer2' },
            { id: 'costing', label: 'Product Costing', icon: 'bi-calculator' },
            { id: 'cost-sheet', label: 'Cost Sheet', icon: 'bi-table' },
            { id: 'target-margin', label: 'Target & Margin', icon: 'bi-graph-up-arrow' },
            { id: 'budgeting', label: 'Order Budgeting', icon: 'bi-wallet2' },
            { id: 'material', label: 'Material Requirement', icon: 'bi-box-seam' },
            { id: 'supplier-cs', label: 'Supplier CS', icon: 'bi-files' },
            { id: 'fabric-trims', label: 'Fabric & Trims', icon: 'bi-layers' },
            { id: 'sample', label: 'Sample Development', icon: 'bi-flask' },
            { id: 'ta-calendar', label: 'T&A Calendar', icon: 'bi-calendar-event' },
            { id: 'production', label: 'Production Follow-up', icon: 'bi-gear' },
            { id: 'shipment', label: 'Shipment Planning', icon: 'bi-truck' },
            { id: 'order-status', label: 'Order Status', icon: 'bi-speedometer' },
            { id: 'profitability', label: 'Profitability', icon: 'bi-coin' },
        ];

        // ====== HELPERS ======
        function showModal(title, html) {
            document.getElementById('aiModalLabel').textContent = title;
            document.getElementById('aiModalBody').innerHTML = html;
            const modal = new bootstrap.Modal(document.getElementById('aiModal'));
            modal.show();
        }

        function sendChat(containerId, inputId) {
            const input = document.getElementById(inputId);
            const msg = input.value.trim();
            if (!msg) return;
            const container = document.getElementById(containerId);
            const userDiv = document.createElement('div');
            userDiv.className = 'chat-msg user';
            userDiv.textContent = msg;
            container.appendChild(userDiv);
            input.value = '';
            setTimeout(() => {
                const aiDiv = document.createElement('div');
                aiDiv.className = 'chat-msg ai';
                const responses = [
                    'I detected a potential duplicate order. Error avoided!',
                    'All mandatory fields are filled. No missing data errors.',
                    'The unit price has been corrected from $12.50 to $12.55 (currency fix).',
                    'I found a mismatch in quantity totals. Automatically reconciled.',
                    'No errors found – your order is clean.',
                    'I corrected the date format to match ERP standards.',
                    'I flagged an inconsistent supplier address and suggested correction.',
                ];
                aiDiv.textContent = responses[Math.floor(Math.random() * responses.length)];
                container.appendChild(aiDiv);
                container.scrollTop = container.scrollHeight;
            }, 600);
        }

        function toggleManual(btn) {
            const card = btn.closest('.demo-card');
            card.classList.toggle('show-manual');
            btn.textContent = card.classList.contains('show-manual') ? 'Show AI View' : 'Show Manual Error';
        }

        // ====== BUILD PANES ======
        function buildPane(moduleId) {
            // Each module gets an error-reduction card and other AI features.
            const panes = {
                'buyer-master': `
                <div class="module-title">Buyer Master <span class="badge-ai"><i class="bi bi-robot"></i> AI</span></div>
                <div class="module-sub">Error reduction: data entry, duplicate profiles, missing compliance.</div>
                <div class="demo-card">
                    <h6><i class="bi bi-exclamation-octagon me-2"></i> Error Reduction: Duplicate Buyer</h6>
                    <button class="btn btn-sm btn-outline-ai toggle-manual" onclick="toggleManual(this)">Show Manual Error</button>
                    <div class="manual-view mt-2"><div class="error-reduction-card"><strong>Manual error:</strong> User created duplicate buyer profile "H&M" twice. <span class="badge bg-danger">Error</span></div></div>
                    <div class="ai-view mt-2"><div class="error-reduction-card fixed" style="border-left-color:#16a34a;"><strong>AI prevention:</strong> AI detected similar name & address, blocked duplicate, suggested merge. <span class="badge bg-success">Fixed</span></div></div>
                </div>
                <div class="demo-card">
                    <h6><i class="bi bi-check-circle me-2"></i> Compliance Validation</h6>
                    <button class="btn btn-ai btn-sm" onclick="showModal('Compliance Error','Manual: Missing buyer quality document. AI: Scanned folder, found document, auto-attached.')">Simulate Missing Doc</button>
                </div>
                <div class="demo-card"><h6><i class="bi bi-chat-dots me-2"></i> Chat</h6><div class="chat-box" id="bmChat"></div><div class="input-group mt-2"><input type="text" class="form-control" id="bmInput" placeholder="Ask about buyer errors" /><button class="btn btn-ai" onclick="sendChat('bmChat','bmInput')">Ask</button></div></div>
            `,

                'buyer-order': `
                <div class="module-title">Buyer Order <span class="badge-ai"><i class="bi bi-robot"></i> AI</span></div>
                <div class="module-sub">Error reduction: PO data entry, amendment miscalculation, duplicate POs.</div>
                <div class="demo-card">
                    <h6><i class="bi bi-file-pdf me-2"></i> PO Extraction Error</h6>
                    <button class="btn btn-sm btn-outline-ai toggle-manual" onclick="toggleManual(this)">Show Manual</button>
                    <div class="manual-view"><div class="error-reduction-card"><strong>Manual:</strong> Clerk misread quantity 5,200 as 52,000. <span class="badge bg-danger">10× error</span></div></div>
                    <div class="ai-view"><div class="error-reduction-card fixed"><strong>AI:</strong> OCR + validation flagged unrealistic qty, cross-checked with history, corrected to 5,200. <span class="badge bg-success">Fixed</span></div></div>
                </div>
                <div class="demo-card"><h6><i class="bi bi-arrow-repeat me-2"></i> Amendment Impact</h6><button class="btn btn-ai btn-sm" onclick="showModal('Amendment Error','Manual: Missed booking update. AI: Auto-recalc fabric booking +15% and alerted planning.')">Simulate</button></div>
                <div class="demo-card"><h6><i class="bi bi-exclamation-triangle me-2"></i> Duplicate PO</h6><div class="alert alert-warning">AI detected duplicate PO. <button class="btn btn-sm btn-outline-ai" onclick="showModal('Duplicate','Manual: Would have created double order. AI blocked and flagged.')">View</button></div></div>
            `,

                'style-master': `
                <div class="module-title">Style Master <span class="badge-ai"><i class="bi bi-robot"></i> AI</span></div>
                <div class="module-sub">Error reduction: tech pack misreading, inconsistent specs, wrong GSM.</div>
                <div class="demo-card">
                    <h6><i class="bi bi-file-earmark-code me-2"></i> Tech Pack Error</h6>
                    <button class="btn btn-sm btn-outline-ai toggle-manual" onclick="toggleManual(this)">Show Manual</button>
                    <div class="manual-view"><div class="error-reduction-card"><strong>Manual:</strong> Operator entered GSM 180 as 80. <span class="badge bg-danger">Wrong</span></div></div>
                    <div class="ai-view"><div class="error-reduction-card fixed"><strong>AI:</strong> Extracted "180 GSM" from PDF, validated against fabric type. <span class="badge bg-success">Correct</span></div></div>
                </div>
                <div class="demo-card"><h6><i class="bi bi-diagram-3 me-2"></i> Similarity Check</h6><button class="btn btn-ai btn-sm" onclick="showModal('Similarity Error','Manual: Copied wrong style specs. AI: Showed 85% match with ST-0987 and flagged differences.')">Simulate</button></div>
            `,

                'order-booking': `
                <div class="module-title">Order Booking <span class="badge-ai"><i class="bi bi-robot"></i> AI</span></div>
                <div class="module-sub">Error reduction: missing fields, breakdown total mismatch, date format errors.</div>
                <div class="demo-card">
                    <h6><i class="bi bi-check-all me-2"></i> Mandatory Fields</h6>
                    <button class="btn btn-sm btn-outline-ai toggle-manual" onclick="toggleManual(this)">Show Manual</button>
                    <div class="manual-view"><div class="error-reduction-card"><strong>Manual:</strong> Forgot to enter destination. Order stuck. <span class="badge bg-danger">Missing</span></div></div>
                    <div class="ai-view"><div class="error-reduction-card fixed"><strong>AI:</strong> Highlighted missing field, suggested default from buyer master. <span class="badge bg-success">Filled</span></div></div>
                </div>
                <div class="demo-card"><h6><i class="bi bi-table me-2"></i> Breakdown Totals</h6><button class="btn btn-ai btn-sm" onclick="showModal('Breakdown Error','Manual: Color breakdown sums to 5,000 but order qty 5,200. AI: Auto-adjusted ratios to match.')">Simulate</button></div>
            `,

                'ie-smv': `
                <div class="module-title">IE & SMV <span class="badge-ai"><i class="bi bi-robot"></i> AI</span></div>
                <div class="module-sub">Error reduction: incorrect SMV, unrealistic TNA dates, line balancing.</div>
                <div class="demo-card">
                    <h6><i class="bi bi-clock me-2"></i> SMV Miscalculation</h6>
                    <button class="btn btn-sm btn-outline-ai toggle-manual" onclick="toggleManual(this)">Show Manual</button>
                    <div class="manual-view"><div class="error-reduction-card"><strong>Manual:</strong> IE engineer used wrong operation time, SMV overestimated. <span class="badge bg-danger">+20%</span></div></div>
                    <div class="ai-view"><div class="error-reduction-card fixed"><strong>AI:</strong> Analyzed operation sequence, suggested SMV 12.5 (vs manual 15.0). <span class="badge bg-success">Corrected</span></div></div>
                </div>
                <div class="demo-card"><h6><i class="bi bi-calendar-event me-2"></i> TNA Generation</h6><button class="btn btn-ai btn-sm" onclick="showModal('TNA Error','Manual: Set cutting start too early. AI: Calculated realistic lead times based on SMV and capacity.')">Simulate</button></div>
            `,

                'costing': `
                <div class="module-title">Product Costing <span class="badge-ai"><i class="bi bi-robot"></i> AI</span></div>
                <div class="module-sub">Error reduction: rate mismatches, missed components, currency errors.</div>
                <div class="demo-card">
                    <h6><i class="bi bi-cash me-2"></i> Rate Mismatch</h6>
                    <button class="btn btn-sm btn-outline-ai toggle-manual" onclick="toggleManual(this)">Show Manual</button>
                    <div class="manual-view"><div class="error-reduction-card"><strong>Manual:</strong> Used $3.50/yd instead of $3.20. Overcost by 9%. <span class="badge bg-danger">Error</span></div></div>
                    <div class="ai-view"><div class="error-reduction-card fixed"><strong>AI:</strong> Retrieved historical rate for similar fabric, suggested $3.20. <span class="badge bg-success">Correct</span></div></div>
                </div>
                <div class="demo-card"><h6><i class="bi bi-arrow-left-right me-2"></i> Currency Conversion</h6><button class="btn btn-ai btn-sm" onclick="showModal('Currency Error','Manual: Missed exchange rate change. AI: Auto-converted using latest rate, alerted finance.')">Simulate</button></div>
            `,

                'cost-sheet': `
                <div class="module-title">Cost Sheet <span class="badge-ai"><i class="bi bi-robot"></i> AI</span></div>
                <div class="module-sub">Error reduction: missing overhead, incorrect totals, formula errors.</div>
                <div class="demo-card">
                    <h6><i class="bi bi-file-spreadsheet me-2"></i> Missing Overhead</h6>
                    <button class="btn btn-sm btn-outline-ai toggle-manual" onclick="toggleManual(this)">Show Manual</button>
                    <div class="manual-view"><div class="error-reduction-card"><strong>Manual:</strong> Forgot to add 5% overhead, cost sheet understated. <span class="badge bg-danger">Under</span></div></div>
                    <div class="ai-view"><div class="error-reduction-card fixed"><strong>AI:</strong> Detected missing overhead, auto-added 5%, flagged for approval. <span class="badge bg-success">Added</span></div></div>
                </div>
                <div class="demo-card"><h6><i class="bi bi-sliders me-2"></i> Sensitivity</h6><button class="btn btn-ai btn-sm" onclick="showModal('Sensitivity Error','Manual: Mis-calculated margin. AI: Real-time slider with automated margin update.')">Simulate</button></div>
            `,

                'target-margin': `
                <div class="module-title">Target & Margin <span class="badge-ai"><i class="bi bi-robot"></i> AI</span></div>
                <div class="module-sub">Error reduction: wrong target price, missed competitor data.</div>
                <div class="demo-card">
                    <h6><i class="bi bi-bar-chart me-2"></i> Target Price Error</h6>
                    <button class="btn btn-sm btn-outline-ai toggle-manual" onclick="toggleManual(this)">Show Manual</button>
                    <div class="manual-view"><div class="error-reduction-card"><strong>Manual:</strong> Set price too low, margin 35% vs target 45%. <span class="badge bg-danger">Under</span></div></div>
                    <div class="ai-view"><div class="error-reduction-card fixed"><strong>AI:</strong> Recommended $14.25 based on competitor and historical data. <span class="badge bg-success">Optimized</span></div></div>
                </div>
            `,

                'budgeting': `
                <div class="module-title">Order Budgeting <span class="badge-ai"><i class="bi bi-robot"></i> AI</span></div>
                <div class="module-sub">Error reduction: budget vs actual mismatch, overspending alerts.</div>
                <div class="demo-card">
                    <h6><i class="bi bi-wallet me-2"></i> Budget Overrun</h6>
                    <button class="btn btn-sm btn-outline-ai toggle-manual" onclick="toggleManual(this)">Show Manual</button>
                    <div class="manual-view"><div class="error-reduction-card"><strong>Manual:</strong> Approved budget without checking actual spend. $2k overrun. <span class="badge bg-danger">Overspent</span></div></div>
                    <div class="ai-view"><div class="error-reduction-card fixed"><strong>AI:</strong> Real-time utilization tracking, flagged overrun early. <span class="badge bg-success">Prevented</span></div></div>
                </div>
            `,

                'material': `
                <div class="module-title">Material Requirement <span class="badge-ai"><i class="bi bi-robot"></i> AI</span></div>
                <div class="module-sub">Error reduction: double wastage, wrong consumption, obsolete library.</div>
                <div class="demo-card">
                    <h6><i class="bi bi-percent me-2"></i> Double Wastage</h6>
                    <button class="btn btn-sm btn-outline-ai toggle-manual" onclick="toggleManual(this)">Show Manual</button>
                    <div class="manual-view"><div class="error-reduction-card"><strong>Manual:</strong> Applied wastage twice, over-ordered by 10%. <span class="badge bg-danger">Extra cost</span></div></div>
                    <div class="ai-view"><div class="error-reduction-card fixed"><strong>AI:</strong> Detected wastage already included in consumption, corrected formula. <span class="badge bg-success">Fixed</span></div></div>
                </div>
            `,

                'supplier-cs': `
                <div class="module-title">Supplier CS <span class="badge-ai"><i class="bi bi-robot"></i> AI</span></div>
                <div class="module-sub">Error reduction: wrong supplier selection, missing comparison data.</div>
                <div class="demo-card">
                    <h6><i class="bi bi-files me-2"></i> Supplier Selection</h6>
                    <button class="btn btn-sm btn-outline-ai toggle-manual" onclick="toggleManual(this)">Show Manual</button>
                    <div class="manual-view"><div class="error-reduction-card"><strong>Manual:</strong> Chose supplier with higher price due to missed quote. <span class="badge bg-danger">Overpay</span></div></div>
                    <div class="ai-view"><div class="error-reduction-card fixed"><strong>AI:</strong> Auto-compared all quotes, highlighted best value. <span class="badge bg-success">Optimal</span></div></div>
                </div>
            `,

                'fabric-trims': `
                <div class="module-title">Fabric & Trims <span class="badge-ai"><i class="bi bi-robot"></i> AI</span></div>
                <div class="module-sub">Error reduction: wrong quantity calculation, color mismatch.</div>
                <div class="demo-card">
                    <h6><i class="bi bi-calculator me-2"></i> Quantity Calculation</h6>
                    <button class="btn btn-sm btn-outline-ai toggle-manual" onclick="toggleManual(this)">Show Manual</button>
                    <div class="manual-view"><div class="error-reduction-card"><strong>Manual:</strong> Used 1.0 yd instead of 1.2 yd, shortage of 1,040 yd. <span class="badge bg-danger">Short</span></div></div>
                    <div class="ai-view"><div class="error-reduction-card fixed"><strong>AI:</strong> Retrieved correct consumption from library, calculated 6,552 yd. <span class="badge bg-success">Accurate</span></div></div>
                </div>
            `,

                'sample': `
                <div class="module-title">Sample Development <span class="badge-ai"><i class="bi bi-robot"></i> AI</span></div>
                <div class="module-sub">Error reduction: missed feedback, misrouted samples.</div>
                <div class="demo-card">
                    <h6><i class="bi bi-chat-right-text me-2"></i> Feedback Misinterpretation</h6>

                    <div class="manual-view"><div class="error-reduction-card"><strong>Manual:</strong> Read "color change" as "size change" – wrong action. <span class="badge bg-danger">Wrong</span></div></div>
                    <div class="ai-view"><div class="error-reduction-card fixed"><strong>AI:</strong> Extracted "color" and "minor change" – created correct task. <span class="badge bg-success">Correct</span></div></div>
                </div>
            `,

                'ta-calendar': `
                <div class="module-title">T&A Calendar <span class="badge-ai"><i class="bi bi-robot"></i> AI</span></div>

                <div class="demo-card">
                    <h6><i class="bi bi-calendar-event me-2"></i> Unrealistic Dates</h6>
                    <button class="btn btn-sm btn-outline-ai toggle-manual" onclick="toggleManual(this)">Show Manual</button>

                'production': `
                <div class="module-title">Production Follow-up <span class="badge-ai"><i class="bi bi-robot"></i> AI</span></div>
                <div class="module-sub">Error reduction: missed bottlenecks, delayed alerts.</div>
                <div class="demo-card">
                    <h6><i class="bi bi-exclamation-octagon me-2"></i> Bottleneck Detection</h6>
                    <button class="btn btn-sm btn-outline-ai toggle-manual" onclick="toggleManual(this)">Show Manual</button>
                    <div class="manual-view"><div class="error-reduction-card"><strong>Manual:</strong> Manager didn't notice sewing delay until 3 days later. <span class="badge bg-danger">Late</span></div></div>
                    <div class="ai-view"><div class="error-reduction-card fixed"><strong>AI:</strong> Real-time monitoring alerted immediately. <span class="badge bg-success">Early</span></div></div>

                'shipment': `
                <div class="module-title">Shipment Planning <span class="badge-ai"><i class="bi bi-robot"></i> AI</span></div>

                'order-status': `

                'profitability': `
                <div class="module-title">Profitability <span class="badge-ai"><i class="bi bi-robot"></i> AI</span></div>

            };
            return panes[moduleId] || `<div class="module-title">Module not found</div>`;
        }

        // ====== INIT ======
        document.addEventListener('DOMContentLoaded', function () {
            const nav = document.getElementById('moduleNav');
            const main = document.getElementById('mainContent');

            modules.forEach((mod, idx) => {
                const link = document.createElement('a');
                link.className = 'module-link' + (idx === 0 ? ' active' : '');
                link.setAttribute('data-module', mod.id);
                link.innerHTML = `<i class="bi ${mod.icon}"></i> ${mod.label}`;
                link.addEventListener('click', function (e) {
                    e.preventDefault();
                    document.querySelectorAll('.module-link').forEach(l => l.classList.remove('active'));
                    this.classList.add('active');
                    document.querySelectorAll('.module-pane').forEach(p => p.classList.remove('active'));
                    const pane = document.getElementById('pane-' + mod.id);
                    if (pane) pane.classList.add('active');
                });
                nav.appendChild(link);

                const pane = document.createElement('div');
                pane.className = 'module-pane' + (idx === 0 ? ' active' : '');
                pane.id = 'pane-' + mod.id;
                pane.innerHTML = buildPane(mod.id);
                main.appendChild(pane);
            });

            // Init chat boxes
            document.querySelectorAll('.chat-box:empty').forEach(c => {
                const div = document.createElement('div');
                div.className = 'chat-msg ai';
                div.textContent = 'Ask me about error reduction in this module.';
                c.appendChild(div);
            });

            // Add a global error reduction summary at the top of the first module (Buyer Master)
            const summary = document.createElement('div');
            summary.className = 'demo-card bg-light';
            summary.innerHTML = `
            <h5><i class="bi bi-graph-up-arrow me-2"></i> AI Error Reduction – At a Glance</h5>
            <div class="row text-center">
                <div class="col-3"><div class="metric-number">89%</div><div class="metric-label">Data Entry Errors Reduced</div></div>
                <div class="col-3"><div class="metric-number">100%</div><div class="metric-label">Mandatory Field Coverage</div></div>
                <div class="col-3"><div class="metric-number">76%</div><div class="metric-label">Calculation Mistakes Avoided</div></div>
                <div class="col-3"><div class="metric-number">92%</div><div class="metric-label">Duplicate/Conflict Prevention</div></div>
            </div>
            <p class="small text-muted mt-2">Based on SRS v2.1 AI governance and human-in-the-loop validation.</p>
        `;
            // Insert at the top of the first pane (buyer-master)
            const firstPane = document.getElementById('pane-buyer-master');
            if (firstPane) {
                firstPane.insertBefore(summary, firstPane.firstChild);
            }
        });
    </script>
</body>
